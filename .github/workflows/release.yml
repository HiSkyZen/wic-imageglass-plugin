name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override, e.g. 1.3.1 (no leading v)"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PLUGIN_FOLDER: Plugin_FastJxrHdrCodec

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      should_release: ${{ steps.meta.outputs.should_release }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version || '' }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          manifest_version="$(jq -r '.version' source/igplugin.json)"
          version="${MANUAL_VERSION:-$manifest_version}"

          if [[ -z "$version" || "$version" == "null" || "$version" == *"-dev"* ]]; then
            echo "Refusing to release invalid version: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$MANUAL_PRERELEASE" >> "$GITHUB_OUTPUT"

          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; skipping duplicate publish."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, platform: x64, arch: win-x64 }
          - { rid: win-arm64, platform: ARM64, arch: win-arm64 }

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Stamp version
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $manifestPath = "source/igplugin.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest | ConvertTo-Json -Depth 5 | Set-Content $manifestPath -Encoding utf8

      - name: Publish
        run: >
          dotnet publish source/WicCodec.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:Version=${{ needs.prepare.outputs.version }}
          --output dist/${{ matrix.rid }}

      - name: Stage and verify plugin
        shell: pwsh
        run: |
          $staged = Join-Path "staging" $env:PLUGIN_FOLDER
          New-Item -ItemType Directory -Force -Path $staged | Out-Null
          Get-ChildItem "dist/${{ matrix.rid }}" -File |
            Where-Object { $_.Extension -notin ".pdb", ".xml" } |
            Where-Object { $_.Name -notlike "libSkiaSharp*" } |
            Copy-Item -Destination $staged

          foreach ($required in "WicCodec.dll", "igplugin.json") {
            if (-not (Test-Path (Join-Path $staged $required))) {
              throw "package is missing $required"
            }
          }

      - name: Pack
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          Compress-Archive -Path "staging/$env:PLUGIN_FOLDER" -DestinationPath "fast-jxr-hdr_${version}_${{ matrix.arch }}.igplugin.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: fast-jxr-hdr-${{ matrix.arch }}
          path: fast-jxr-hdr_*.igplugin.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          args=(
            release create "v$VERSION"
            artifacts/*.igplugin.zip
            --target "${{ github.sha }}"
            --title "Fast JXR HDR Codec v$VERSION"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
