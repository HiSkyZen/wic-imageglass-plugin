name: Build

on:
  push:
    branches:
      - "dev/**"
  pull_request:
    branches:
      - main

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate benchmark script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "bench-fastjxr.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            throw "bench-fastjxr.ps1 has PowerShell syntax errors"
          }

      - name: Restore
        run: dotnet restore source/WicCodec.csproj -r win-x64

      - name: Publish NativeAOT x64
        run: dotnet publish source/WicCodec.csproj -c Release -r win-x64 -p:Platform=x64 --no-restore -o artifacts/publish

      - name: Pack installable plugin
        shell: pwsh
        run: |
          $pluginDir = "artifacts/package/Plugin_FastJxrHdrCodec"
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          Get-ChildItem "artifacts/publish" -File |
            Where-Object { $_.Extension -notin ".pdb", ".xml" } |
            Where-Object { $_.Name -notlike "libSkiaSharp*" } |
            Copy-Item -Destination $pluginDir
          Compress-Archive -Path $pluginDir -DestinationPath "artifacts/fast-jxr-hdr_ci_win-x64.igplugin.zip"

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: fast-jxr-hdr-win-x64
          path: artifacts/fast-jxr-hdr_ci_win-x64.igplugin.zip
          if-no-files-found: error
